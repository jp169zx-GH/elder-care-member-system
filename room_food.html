<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>住房餐饮 & 酒店系统对接</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body{padding:30px;}
        .box{background:#fff;padding:20px;border-radius:8px;margin:15px 0;}
        button{padding:10px;background:#27ae60;color:#fff;border:none;border-radius:4px;}
        #auth-loading{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#f1f3f6;color:#555;font-size:16px;}
        #auth-loading.hidden{display:none;}
        #app-root{display:none;}
        #app-root.ready{display:block;}
    </style>
</head>
<body>
    <div id="auth-loading">正在验证登录状态 …</div>

    <div id="app-root">
        <div class="box">
            <h3>全部康养房源（同步酒店）</h3>
            <div id="roomList"></div>
            <button onclick="getRoom()">刷新房源</button>
        </div>

        <div class="box">
            <h3>酒店账单自动对账</h3>
            <input placeholder="输入酒店订单号" id="orderNo">
            <button onclick="hotelCheck()">开始对账</button>
            <div id="hotelRes"></div>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://txvyplfaaisrzbwpoqcd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ZgDcY0b1NGjf1iEArms2Dw_GMDlIOU5';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkAuth() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }
        document.getElementById('auth-loading').classList.add('hidden');
        document.getElementById('app-root').classList.add('ready');
        getRoom();
    }
    supabaseClient.auth.onAuthStateChange((event) => {
        if (event === 'SIGNED_OUT') window.location.href = 'login.html';
    });
    checkAuth();

//获取房源
function getRoom(){
    fetch("/app/controller/RoomFood.php/roomList")
    .then(res=>res.json()).then(d=>{
        document.getElementById('roomList').innerHTML = JSON.stringify(d,null,2);
    })
}

//酒店财务对账
function hotelCheck(){
    let no = document.getElementById('orderNo').value;
    fetch("/app/controller/HotelSync.php/checkSync?order_no="+no)
    .then(res=>res.json()).then(d=>{
        document.getElementById('hotelRes').innerHTML = JSON.stringify(d.data,null,2);
        alert("酒店对账完成！")
    })
}
</script>
</body>
</html>
