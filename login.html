<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>养老会员管理系统-登录</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    body{background:#f5f7fa;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:-apple-system,"Segoe UI",Arial,sans-serif;}
    .login-box{width:350px;padding:40px;background:#fff;border-radius:10px;box-shadow:0 0 20px #eee;}
    h2{text-align:center;color:#2c3e50;margin:0 0 30px;}
    input{width:100%;box-sizing:border-box;padding:12px 15px;margin:10px 0;border:1px #ddd solid;border-radius:6px;font-size:15px;}
    button{width:100%;padding:13px;background:#27ae60;border:none;color:#fff;font-size:16px;border-radius:6px;cursor:pointer;}
    button:disabled{opacity:0.6;cursor:default;}
    .msg{font-size:13px;text-align:center;margin-top:14px;min-height:1.2em;}
    .msg.error{color:#c0392b;}
    .msg.ok{color:#27ae60;}
</style>
</head>
<body>
    <div class="login-box">
        <h2>后台管理登录</h2>
        <input type="email" id="username" placeholder="管理员邮箱" autocomplete="username">
        <input type="password" id="pwd" placeholder="登录密码" autocomplete="current-password">
        <button id="btn-login" onclick="login()">立即登录</button>
        <div class="msg" id="login-msg"></div>
    </div>

<script>
    const SUPABASE_URL = 'https://txvyplfaaisrzbwpoqcd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ZgDcY0b1NGjf1iEArms2Dw_GMDlIOU5';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // If already logged in, skip straight to the app
    (async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) window.location.href = 'index.html';
    })();

    async function login() {
        const email = document.getElementById('username').value.trim();
        const pwd = document.getElementById('pwd').value;
        const btn = document.getElementById('btn-login');
        const msg = document.getElementById('login-msg');

        if (!email || !pwd) {
            msg.textContent = '请输入邮箱与密码';
            msg.className = 'msg error';
            return;
        }

        btn.disabled = true;
        btn.textContent = '登录中…';
        msg.textContent = '';
        msg.className = 'msg';

        const { error } = await supabaseClient.auth.signInWithPassword({ email, password: pwd });

        if (error) {
            msg.textContent = '登录失败：' + (error.message || '请检查账号密码');
            msg.className = 'msg error';
            btn.disabled = false;
            btn.textContent = '立即登录';
            return;
        }

        msg.textContent = '登录成功，正在跳转…';
        msg.className = 'msg ok';
        window.location.href = 'index.html';
    }

    // Allow Enter key to submit
    document.getElementById('pwd').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') login();
    });
</script>
</body>
</html>
