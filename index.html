<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>养老会员管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body{margin:0;background:#f1f3f6;font-family:-apple-system,"Segoe UI",Arial,sans-serif;}
        .header{background:#2c3e50;color:#fff;padding:20px;text-align:center;font-size:22px;position:relative;}
        .signout-btn{position:absolute;top:18px;right:20px;background:none;border:1px solid rgba(255,255,255,0.4);color:#fff;font-size:13px;padding:6px 14px;border-radius:20px;cursor:pointer;}
        .signout-btn:hover{background:rgba(255,255,255,0.15);}
        .nav{display:flex;justify-content:center;margin-top:50px;gap:30px;flex-wrap:wrap;}
        .nav-item{width:220px;height:160px;background:#fff;border-radius:12px;display:flex;justify-content:center;align-items:center;font-size:18px;color:#222;box-shadow:0 2px 12px #ddd;cursor:pointer;}
        .nav-item:hover{background:#27ae60;color:#fff;}
        #auth-loading{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#f1f3f6;color:#555;font-size:16px;}
        #auth-loading.hidden{display:none;}
        #app-root{display:none;}
        #app-root.ready{display:block;}
    </style>
</head>
<body>
    <div id="auth-loading">正在验证登录状态 …</div>

    <div id="app-root">
        <div class="header">
            <button class="signout-btn" onclick="signOut()">退出登录</button>
            高端养老会员综合管理系统（银行托管+酒店对接版）
        </div>
        <div class="nav">
            <div class="nav-item" onclick="location.href='health.html'">健康档案管理</div>
            <div class="nav-item" onclick="location.href='finance.html'">缴费&保证金托管</div>
            <div class="nav-item" onclick="location.href='room_food.html'">住房餐饮&酒店对接</div>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://txvyplfaaisrzbwpoqcd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ZgDcY0b1NGjf1iEArms2Dw_GMDlIOU5';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkAuth() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = 'login.html';
            return;
        }
        document.getElementById('auth-loading').classList.add('hidden');
        document.getElementById('app-root').classList.add('ready');
    }

    async function signOut() {
        await supabaseClient.auth.signOut();
        window.location.href = 'login.html';
    }

    supabaseClient.auth.onAuthStateChange((event) => {
        if (event === 'SIGNED_OUT') window.location.href = 'login.html';
    });

    checkAuth();
</script>
</body>
</html>
